
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoCoach</title>
    <link rel="icon" type="image/svg+xml" href="/nebula-favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        /* ── Color tokens — "Ink & Paper" editorial identity ────────
           Paper-white ground, near-black ink, ONE burnt-orange accent.
           NOTE: --rose/--pink keep their names for compatibility but
           now carry the accent (burnt orange #c2410c). ───────────── */
        --bg:              #fcfcfa;
        --surface:         #fffffe;
        --surface-muted:   #f4f3ee;
        --border:          #d9d9d2;
        --border-focus:    #c2410c;
        --text-primary:    #111110;
        --text-secondary:  #4a4a46;
        --text-muted:      #6e6e68;
        --text-placeholder:#a3a39c;
        --rose:            #c2410c;
        --rose-50:         #f7e8e0;
        --green:           #2f6b3f;
        --green-bg:        #e9f1ea;
        --amber:           #92610a;
        --amber-bg:        #f6efdd;
        --red:             #a52a2a;
        --red-bg:          #f7e9e7;
        /* Legacy aliases — keep so existing components don't break */
        --bg-deep:         var(--bg);
        --bg-surface:      var(--surface-muted);
        --bg-card:         var(--surface);
        --bg-elevated:     var(--surface-muted);
        --border-subtle:   var(--border);
        --border-medium:   #c9c9c0;
        --pink:            var(--rose);
        --pink-dim:        rgba(194,65,12,0.08);
        --pink-glow:       rgba(194,65,12,0.16);
        --orb-violet:      #d9d9d2;
        --orb-pink:        #e8c9b8;
        --orb-blue:        #d9d9d2;

        /* ── Type scale (1.25 ratio, rem-based) ──────────────────────
           xs:   0.6875rem / 11px  — absolute minimum for labels
           sm:   0.8125rem / 13px  — secondary info, timestamps
           base: 1rem      / 16px  — body copy (browser default, zoomable)
           md:   1.125rem  / 18px  — comfortable reading
           lg:   1.375rem  / 22px  — subheadings
           xl:   1.75rem   / 28px  — headings
        ──────────────────────────────────────────────────────────── */
        --text-xs:   0.6875rem;
        --text-sm:   0.8125rem;
        --text-base: 1rem;
        --text-md:   1.125rem;
        --text-lg:   1.375rem;
        --text-xl:   1.75rem;

        /* Role-based line heights */
        --lh-tight:  1.15;   /* headings, display */
        --lh-snug:   1.35;   /* subheadings, labels */
        --lh-body:   1.65;   /* body copy */
        --lh-relaxed:1.8;    /* long-form reading */

        /* Letter spacing roles */
        --ls-tight:  -0.02em; /* display headings */
        --ls-normal:  0;
        --ls-wide:    0.04em; /* labels */
        --ls-wider:   0.08em; /* micro-labels, ALL CAPS */
      }

      body {
        font-family: 'Fraunces', Georgia, serif;
        background-color: var(--bg);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
      }

      /* Tabular numbers — prevents score digits from jumping width */
      .num { font-variant-numeric: tabular-nums; }

      /* Brand / headline role */
      .font-brand { font-family: 'Fraunces', Georgia, serif; font-weight: 600; letter-spacing: -0.01em; }

      /* Micro-label — mono small caps, book-margin style */
      .label-micro {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: var(--text-xs);
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        line-height: var(--lh-snug);
      }

      /* Subtle noise grain overlay */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.018;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 128px;
      }

      ::selection {
        background: var(--pink-glow);
      }

      * { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.1) transparent; }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.18); }

      .font-mono  { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .font-display { font-family: 'Fraunces', Georgia, serif; }

      /* Focus-visible ring — keyboard users only */
      :focus-visible {
        outline: 2px solid var(--rose);
        outline-offset: 2px;
        border-radius: 4px;
      }
      :focus:not(:focus-visible) { outline: none; }

      /* Respect reduced motion preference */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Staggered entrance animations */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes bounceIn {
        0% { opacity: 0; transform: translate(-50%, 10px) scale(0.9); }
        70% { opacity: 1; transform: translate(-50%, -5px) scale(1.05); }
        100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      }
      @keyframes pulse-custom {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(0.99); }
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 12px var(--pink-dim), 0 0 32px rgba(194,65,12,0.04); }
        50% { box-shadow: 0 0 20px var(--pink-glow), 0 0 48px rgba(194,65,12,0.08); }
      }

      .animate-fade-in { animation: fadeInUp 0.5s ease-out forwards; }
      .animate-fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .animate-playing { animation: pulse-custom 1.5s infinite ease-in-out; }
      .animate-bounce-in { animation: bounceIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      .animate-glow { animation: glow-pulse 2.5s ease-in-out infinite; }

      .stagger-1 { animation-delay: 0.05s; opacity: 0; }
      .stagger-2 { animation-delay: 0.1s; opacity: 0; }
      .stagger-3 { animation-delay: 0.15s; opacity: 0; }
      .stagger-4 { animation-delay: 0.2s; opacity: 0; }
      .stagger-5 { animation-delay: 0.25s; opacity: 0; }
      .stagger-6 { animation-delay: 0.3s; opacity: 0; }

      /* Section reveal — staggered children in result card */
      @keyframes sectionReveal {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-section { animation: sectionReveal 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

      /* Score pop — for badge/number appearance */
      @keyframes scorePop {
        0% { opacity: 0; transform: scale(0.6); }
        70% { transform: scale(1.08); }
        100% { opacity: 1; transform: scale(1); }
      }
      .animate-score-pop { animation: scorePop 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

      /* Word pill entrance — staggered slide up */
      @keyframes pillSlide {
        from { opacity: 0; transform: translateY(6px) scale(0.92); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-pill { animation: pillSlide 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

      /* Ambient orb drift — slow, subtle float for side decorations */
      @keyframes orbDrift {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      @keyframes orbDriftSlow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .orb-drift { animation: orbDrift 8s ease-in-out infinite; }
      .orb-drift-slow { animation: orbDriftSlow 12s ease-in-out infinite; }

      /* Interactive focus/hover states — Ink & Paper: underline rule,
         not a boxed border. Focus thickens the rule in accent ink. */
      .input-focus {
        border: none;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
        transition: border-color 0.2s;
      }
      .input-focus:focus, .input-focus:focus-visible {
        border-bottom-color: var(--rose) !important;
        outline: none;
      }
      .hover-rose:hover, .hover-rose:focus-visible {
        color: var(--rose) !important;
      }
      .hover-red:hover, .hover-red:focus-visible {
        color: var(--red) !important;
      }

      /* Ink & Paper: no floating cards, no lift — hover is a quiet
         border-darkening, like ink bleeding slightly into the page */
      .card-hover { transition: border-color 0.25s ease; }
      .card-hover:hover { border-color: var(--border-medium); }

      /* "Glass" panels become flat paper sheets with an ink rule */
      .glass {
        background: var(--surface);
        border: 1px solid var(--border-medium);
        box-shadow: none;
      }

      /* Former nebula glow — quiet paper, no atmosphere gradients */
      .nebula-glow { background: none; }

      /* ─── Recording visualizer ─── */
      @keyframes rec-ring-pulse {
        0%, 100% { transform: scale(1); opacity: 0.3; }
        50% { transform: scale(1.35); opacity: 0; }
      }
      @keyframes rec-bar {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
      }
      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.92); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes float-up {
        from { opacity: 0; transform: translateY(8px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .animate-scale-in { animation: scale-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .animate-float-up { animation: float-up 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

      .rec-ring {
        animation: rec-ring-pulse 1.8s ease-out infinite;
      }
      .rec-bar {
        transform-origin: bottom;
        animation: rec-bar 0.8s ease-in-out infinite;
      }

      /* Word pill horizontal scroll */
      .word-pills-scroll {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .word-pills-scroll::-webkit-scrollbar { display: none; }

      /* Score ring glow effect */
      .score-glow {
        filter: drop-shadow(0 0 8px var(--pink-dim));
      }

      /* Interactive hover lift */
      .hover-lift {
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .hover-lift:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      }

      /* Button press feedback */
      button:not(:disabled):active {
        transform: scale(0.97);
      }
      a[href]:active {
        transform: scale(0.97);
      }

      /* ─── Flat paper utilities (formerly Stitch glass) ─── */
      .ghost-border {
        outline: 1px solid rgba(17, 17, 16, 0.08);
      }
      .action-bar-glow {
        box-shadow: none;
      }
      .glass-card {
        background: var(--surface);
        border: 1px solid var(--border-medium);
        box-shadow: none;
      }

      /* ─── Stitch animations ─── */
      @keyframes circleGrow {
        0% { stroke-dashoffset: 276; transform: rotate(-100deg); }
        100% { transform: rotate(-90deg); }
      }
      @keyframes progressSlide {
        0% { width: 0%; opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes modalEntrance {
        0% { opacity: 0; transform: scale(0.95); }
        100% { opacity: 1; transform: scale(1); }
      }
      .animate-modal-in { animation: modalEntrance 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

      /* Celebration burst for high scores */
      @keyframes celebratePulse {
        0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
        50% { box-shadow: 0 0 0 12px rgba(34,197,94,0); }
        100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
      }
      @keyframes celebrateShine {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .celebrate-pulse {
        animation: celebratePulse 1s ease-out 2;
      }
      .celebrate-shine {
        background: linear-gradient(90deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
        background-size: 200% 100%;
        animation: celebrateShine 1.5s ease-in-out 1;
      }
      .animate-circle-grow { animation: circleGrow 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards; transform-origin: center; }
      .animate-slide-in { animation: progressSlide 0.6s ease-out forwards; }
    </style>
</head>
  <body class="overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
